name: OLFYNE catalog health

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/catalog-health.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify every perfume URL and product image
        run: python scripts/validate_catalog.py
      - name: Publish health results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog-meta.json data/disabled-items.json data/catalog-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified perfume links and images [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
